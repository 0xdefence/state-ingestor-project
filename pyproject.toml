[project]
name = "alexis-tutor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "pydantic>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
    "fastapi>=0.116,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
alexis = "services.cli.main:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
